<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1E293B",
                        secondary: "#0F766E",
                        accent: "#D4A017",
                        lightBg: "#F8FAFC"
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        display: ['"Fraunces"', 'ui-serif', 'Georgia', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-image:
                radial-gradient(900px 320px at 12% -80px, rgba(15,118,110,0.08), transparent 70%),
                radial-gradient(800px 300px at 92% -60px, rgba(99,102,241,0.07), transparent 70%);
            background-repeat: no-repeat;
        }
            </style>
</head>
<body class="bg-lightBg text-slate-900 font-sans antialiased min-h-screen">
    <header class="border-b border-slate-200 bg-white">
        <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
            <div>
                <a href="/Home" class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-white font-bold text-xl shadow-md">
                    <img src="{{ url_for('static', filename='logo.jpg') }}" alt="EduConnect logo" class="w-10 h-10 rounded-xl object-cover">
                </div>
                <span class="font-display text-2xl font-semibold tracking-tight text-primary">EduConnect</span>
            </a>
                <p class="text-sm text-slate-500">Welcome back</p>
            </div>
            <nav class="flex gap-4 text-sm font-semibold text-primary">
                <a href="/register" class="border border-slate-200 hover:border-secondary hover:text-secondary px-4 py-2.5 rounded-xl transition-colors">Register</a>
            </nav>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-16">
        <section class="rounded-2xl border border-slate-200 bg-white p-10 shadow-sm">
            <h1 class="font-display text-4xl font-semibold text-primary tracking-tight">Login to EduConnect</h1>
            <p class="mt-3 text-slate-600">
                Choose your role and enter your details below.
                You'll be redirected to your dashboard once you're signed in.
            </p>

            {% if error_message %}
            <div class="mt-6 rounded-2xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
                {{ error_message }}
            </div>
            {% endif %}

            <form action="/login" method="post" class="mt-8 space-y-6">
                <fieldset>
                    <legend class="text-sm font-semibold text-slate-700 mb-3">Login as</legend>
                    <div class="grid sm:grid-cols-2 gap-4">
                        <label class="flex items-start gap-3 rounded-2xl border border-slate-200 p-5 cursor-pointer hover:bg-slate-50">
                            <input type="radio" name="role" value="student" checked class="mt-1 h-4 w-4 text-secondary focus:ring-secondary">
                            <span class="flex items-start gap-3">
                                <span class="mt-0.5 w-9 h-9 shrink-0 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
                                    <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L2 8l10 5 10-5-10-5z"/><path d="M6 10v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5"/></svg>
                                </span>
                                <span>
                                    <span class="block font-semibold text-primary">Student</span>
                                    <span class="block text-sm text-slate-500">Access the student dashboard.</span>
                                </span>
                            </span>
                        </label>
                        <label class="flex items-start gap-3 rounded-2xl border border-slate-200 p-5 cursor-pointer hover:bg-slate-50">
                            <input type="radio" name="role" value="mentor" class="mt-1 h-4 w-4 text-secondary focus:ring-secondary">
                            <span class="flex items-start gap-3">
                                <span class="mt-0.5 w-9 h-9 shrink-0 rounded-lg bg-violet-50 text-violet-600 flex items-center justify-center">
                                    <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/><path d="M17 10.5c1.5-.3 2.5-1.6 2.5-3.2A3.3 3.3 0 0016 4"/></svg>
                                </span>
                                <span>
                                    <span class="block font-semibold text-primary">Mentor</span>
                                    <span class="block text-sm text-slate-500">Access the mentor dashboard.</span>
                                </span>
                            </span>
                        </label>
                    </div>
                </fieldset>

                <div class="grid sm:grid-cols-2 gap-5">
                    <div>
                        <label for="full_name" class="block text-sm font-semibold text-slate-700">Full name</label>
                        <input id="full_name" name="full_name" type="text" required class="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3 focus:border-secondary focus:outline-none">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-semibold text-slate-700">Email</label>
                        <input id="email" name="email" type="email" required class="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3 focus:border-secondary focus:outline-none">
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pt-2">
                    <p class="text-sm text-slate-500">
                        New here? <a href="/register" class="font-semibold text-secondary">Create an account</a> first.
                    </p>
                    <button type="submit" class="rounded-2xl bg-accent px-8 py-3 font-bold text-slate-900 hover:bg-amber-400">
                        Login
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
